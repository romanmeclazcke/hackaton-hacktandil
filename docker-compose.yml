services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plan-render-backend
    working_dir: /app
    command: >
      sh -c "python -m src.core.init_db &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Plan Render Backend
      APP_ENV: development
      APP_DEBUG: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plan_render
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: plan-render-db
    environment:
      POSTGRES_DB: plan_render
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plan_render"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
